<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iseo Kim — Unstuck by Design</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#171717">
<meta name="description" content="사용자의 물음표를 느낌표로 바꾸는 UI/UX 디자이너 김이서의 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="main/app.css?v=1794752661">
<link rel="stylesheet" href="main/tone.css?v=1794752661">
<style>html,body{background:#171717}
/* hold the page back until the intro stage is up, so a reload never flashes the half-styled chapters */
#root{opacity:0;transition:opacity .35s ease}html.mp-ready #root{opacity:1}</style>
<script>
/* SENSE symbol on the earbuds case screen (replaces the word): violet, glowing, on the screen's dark ground */
(function(){var img=new Image(),ok=false,wait=[];img.onload=function(){ok=true;wait.splice(0).forEach(function(f){try{f()}catch(e){}})};img.src='img/sense-symbol.png';
window.__senseSym=function(ctx,w,h,col,redo){if(!ok){wait.push(redo);return false}
ctx.save();ctx.shadowBlur=0;ctx.fillStyle=(col&&col.bg)||'#05030a';ctx.fillRect(0,0,w,h);
var sh=h*.62,sw=sh*img.width/img.height,x=(w-sw)/2,y=(h-sh)/2;
var c=document.createElement('canvas');c.width=img.width*8;c.height=img.height*8;var g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,0,0,c.width,c.height);g.globalCompositeOperation='source-in';g.fillStyle=(col&&col.ink)||'#b98bff';g.fillRect(0,0,c.width,c.height);
ctx.shadowColor=(col&&col.glow)||'rgba(154,75,255,.9)';ctx.shadowBlur=26;ctx.drawImage(c,x,y,sw,sh);ctx.shadowBlur=10;ctx.drawImage(c,x,y,sw,sh);
ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,.16)';for(var k=0;k<h;k+=4)ctx.fillRect(0,k,w,1);ctx.restore();return true}})();
</script>
<script>
/* hover on a first-screen object: its screen shows the project's mark */
window.__isHov=function(n){var o=document.querySelector('.obj[data-obj="'+n+'"]');return !!(o&&o.classList.contains('hov'))};
(function(){var L={sense:['img/sense-symbol.png','#b98bff','rgba(154,75,255,.9)',.62],gpt:['img/chatgpt-mark.png','#7dffae','rgba(43,255,126,.85)',.62],lotte:['img/lotte-glyph.png','#ff6a5a','rgba(255,77,61,.9)',.78]},I={};
Object.keys(L).forEach(function(k){var im=new Image();im.onload=function(){I[k].ok=true;I[k].w.splice(0).forEach(function(f){try{f()}catch(e){}})};I[k]={im:im,ok:false,w:[]};im.src=L[k][0]});
window.__drawLogo=function(ctx,w,h,k,redo){var e=I[k],cfg=L[k];if(!e)return false;if(!e.ok){redo&&e.w.push(redo);return false}var img=e.im;
ctx.save();ctx.shadowBlur=0;ctx.fillStyle='#030304';ctx.fillRect(0,0,w,h);var sh=h*cfg[3],sw=sh*img.width/img.height;if(sw>w*.8){sw=w*.8;sh=sw*img.height/img.width}var x=(w-sw)/2,y=(h-sh)/2,src=img;
if(cfg[1]){var c=document.createElement('canvas');c.width=img.width*8;c.height=img.height*8;var g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);g.globalCompositeOperation='source-in';g.fillStyle=cfg[1];g.fillRect(0,0,c.width,c.height);src=c;ctx.shadowColor=cfg[2];ctx.shadowBlur=26;ctx.drawImage(src,x,y,sw,sh);ctx.shadowBlur=10}
ctx.drawImage(src,x,y,sw,sh);ctx.restore();return true}})();
</script>
<script>try{history.scrollRestoration='manual'}catch(e){}window.scrollTo(0,0);
(function r(){var s=document.getElementById('stage');if(s&&s.dataset.phase&&document.querySelector('.page .head')){requestAnimationFrame(function(){document.documentElement.classList.add('mp-ready')});return}requestAnimationFrame(r)})();
setTimeout(function(){document.documentElement.classList.add('mp-ready')},4000);</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="main/app.js?v=1794752661"></script>
<script src="main/tone.js?v=1794752661" defer></script>
</body>
